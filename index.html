function candidatos(dow,t,zona,lim=8,excl,fac){

 return R.filter(r=>r.dow===dow&&!r.riv&&r.n>=15&&r.ini<=t+15&&r.fin-VIS>=t&&!V[r.id]&&!covG.has(r.gk)&&!(excl&&excl.has(r.id))&&(fac==null||r.fi===fac))
  .map(r=>{const g=gain(r),w=!zs?1:r.z===zona?1.6:zs.includes(r.z)?1.3:.55;return{r,g,sc:g*w*(r.ini>t?.85:1)}})

}
function alternativas(id){

function card(r,o={}){
 const v=V[r.id],p=o.plan,zc=ZC[r.z]||'#9aa3b5',t=nowM(),isT=fecha===today();
 const enCurso=isT&&r.dow===new Date().getDay()&&r.ini<=t&&r.fin>t;
 let tags=`<i class="tag z" style="background:${zc}">Z${esc(r.z)}</i>`;
 if(p)tags+=`<i class="tag ${p.pr}">${p.pr}</i>`;
 if(v)tags+=v.e==='ok'?`<i class="tag ok">✔ ${v.n} · ${esc(v.por)}</i>`:`<i class="tag no">${v.e==='sin'?'Sin clase':'No dejaron'}</i>`;
 else if(enCurso)tags+='<i class="tag now">EN CLASE AHORA</i>';
 else if(isT&&p&&r.fin-VIS<t)tags+='<i class="tag late">SE PASÓ</i>';
 if(cubOtra(r))tags+='<i class="tag ok">✔ mismo grupo ya visitado</i>';
 const g=o.alt?o.alt.g:p?p.est:gain(r);
 const head=p?`<b style="font-size:17px">${hm(p.h)}</b>`:`<b>${DN[r.dow]} ${hm(r.ini)}</b>`;
 const acts=v?(v.e==='ok'?`<button class="g" data-a="cnt">✔ ${v.n} alumnos · nota ✎</button><button data-a="del">Deshacer</button>`:`<button class="y" data-a="alt">⚡ Aulas de respuesta</button><button data-a="del">Deshacer</button>`)
  :`<button class="p" data-a="ok">✔ Visitada</button><button data-a="sin" title="No hubo clase">✗ Sin clase</button><button data-a="no" title="El docente no dejó entrar">🚫</button>`;
 return `<article class="c${v?(v.e==='ok'?' done':' fail'):''}" style="--k:${zc}" data-id="${r.id}">
 <div class="t">${head}${tags}<span class="sp">${r.n} alum. · +${fmt(g)}</span></div>
 <h3>Aula ${esc(r.aula)} <small>${esc(r.ed)}</small></h3>
 <p>${esc(r.car)} · <b>${esc(r.cur)}.º</b> · ${esc(r.mat)} · Gr. ${esc(r.gr)}</p>
 <p class="s">${esc(r.fac)} · ${esc(r.doc)} · clase ${hm(r.ini)}–${hm(r.fin)}${r.car.toUpperCase()==='DERECHO'?' · <b style="color:#c0392b">versión segura</b>':''}</p>
 ${v?.nota?`<div class="nota">💬 ${esc(v.nota)}</div>`:''}
 <div class="a">${acts}</div></article>`;
}

function cardMini(r,p){
 const v=V[r.id],c=!v&&cubOtra(r);
 const est=c?'<i class="tag ok">✔ mismo grupo</i>':v.e==='ok'?`<i class="tag ok">✔ ${v.n}</i>`:`<i class="tag no">${v.e==='sin'?'Sin clase':'No dejaron'}</i>`;

function cardCub(r,p){

function vRuta(){

 const hechas=P.filter(p=>V[p.id]?.e==='ok').length,fall=P.filter(p=>V[p.id]&&V[p.id].e!=='ok').length,cub=P.filter(p=>cubOtra(R[p.id])).length;
 const sig=P.find(p=>!V[p.id]&&!cubOtra(R[p.id])&&(!isT||R[p.id].fin-VIS>=t));
 let hero='';
 if(sig){const r=R[sig.id],dt=sig.h-t;
  hero=`<div class="hero"><div class="lb">${isT?(dt<=0?'VE AHORA':'PRÓXIMA PARADA · en '+(dt>=60?Math.floor(dt/60)+' h '+(dt%60)+' min':dt+' min')):'PRIMERA PARADA'}</div>
  <h2>Aula ${esc(r.aula)} · ${hm(sig.h)}</h2><p>${esc(r.ed)}</p><p><b>${esc(r.car)} ${esc(r.cur)}.º</b> · ${esc(r.mat)} · Gr. ${esc(r.gr)} · ${r.n} alumnos</p>

 else if(P.length)hero=`<div class="hero"><div class="lb">DÍA COMPLETO</div><h2>¡Ruta terminada!</h2><p>Usa ⚡ Ahora para seguir sumando aulas.</p></div>`;
 const pct=P.length?(hechas+cub)/P.length*100:0;
 let html=hero+`<div class="k"><div class="row"><div><b>${hechas} de ${P.length} aulas hechas</b><span>${cub?cub+' ya cubiertas · ':''}${fall?fall+' fallidas · ':''}${Math.round(pct)}%</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>
 <p class="s">Total campaña: <b>${fmt(U.tot)}</b> estudiantes únicos de ${fmt(META)}.</p></div>`;
 const res=p=>!!V[p.id]||cubOtra(R[p.id]);

  if(!res(p))html+=card(R[p.id],{plan:p})}
 const H=P.filter(res);

 if(!P.length)html+='<div class="e">No hay ruta planificada para este día. Usa ⚡ Ahora.</div>';
 $('#v-ruta').innerHTML=html;
