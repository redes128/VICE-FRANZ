const esBase=gk=>{const mk=gk.slice(0,gk.lastIndexOf('|'));return (gk.split('·')[1]||'')===(BT.get(mk)?.t||'')};
const grLbl=gk=>{const [g,t]=gk.slice(gk.lastIndexOf('|')+1).split('·');return esBase(gk)?g:g+' ('+t+')'};

const mSum=new Map();gSize.forEach((n,gk)=>{if(!esBase(gk))return;const mk=gk.slice(0,gk.lastIndexOf('|'));mSum.set(mk,(mSum.get(mk)||0)+n)});
const COH=new Map();mSum.forEach((s,mk)=>{const p=mk.split('|'),c=p[0]+'|'+p[1];COH.set(c,Math.max(COH.get(c)||0,s))});

/* ---------- Cobertura (estudiantes únicos estimados) ---------- */
let covG=new Set(),covBy=new Map(),covM=new Map(),U={tot:0,car:{},coh:new Map()};
function derive(){
 covG=new Set();covBy=new Map();covM=new Map();const gN=new Map();
 for(const[id,v]of Object.entries(V)){if(v.e!=='ok')continue;const r=R[id];if(!r)continue;const n=Math.min(v.n??r.n,COH.get(r.coh)||r.n);
  if(covG.has(r.gk)){gN.set(r.gk,Math.max(gN.get(r.gk),n));continue}covG.add(r.gk);covBy.set(r.gk,{id:+id,por:v.por});gN.set(r.gk,n)}
 gN.forEach((n,gk)=>{const mk=gk.slice(0,gk.lastIndexOf('|'));covM.set(mk,(covM.get(mk)||0)+n)});
 const coh=new Map();covM.forEach((c,mk)=>{const p=mk.split('|'),k=p[0]+'|'+p[1],S=COH.get(k)||1;const o=coh.get(k)||1;coh.set(k,o*(1-Math.min(1,c/S)))});
 const car={};let tot=0;coh.forEach((prod,k)=>{const ci=+k.split('|')[0];car[ci]=(car[ci]||0)+(COH.get(k)||0)*(1-prod)});
 for(const ci in car){const cap=DATA.CM[ci]||Infinity;car[ci]=Math.min(car[ci],cap);tot+=car[ci]}
 U={tot,car,coh};render();
}
const cohPct=r=>1-(U.coh.get(r.coh)??1);
const grVis=r=>{const o=[];covG.forEach(gk=>{if(gk.startsWith(r.mk+'|'))o.push(grLbl(gk))});return o.sort((a,b)=>(parseInt(a)||0)-(parseInt(b)||0)||a.localeCompare(b))};
const GUIA=new Map();mSum.forEach((s,mk)=>{const p=mk.split('|'),c=p[0]+'|'+p[1];const g=GUIA.get(c);if(!g||s>g.s)GUIA.set(c,{mk,s,mat:p.slice(2).join('|')})});
function etiquetaCurso(r){
 if(V[r.id])return'';const p=cohPct(r),gv=grVis(r),g=GUIA.get(r.coh);
 if(p<0.01&&!gv.length)return g&&g.mk!==r.mk?`<p class="s">🎓 ${esc(r.cur)}.º año sin visitar · materia guía: <b>${esc(g.mat)}</b></p>`:'';
 const pc=Math.round(p*100),col=p>=.85?'var(--ok)':p>=.4?'#b07800':'var(--mut)';
 let t=`🎓 <b style="color:${col}">${esc(r.cur)}.º año ya alcanzado ${pc}%</b>`;
 t+=gv.length?` · de esta materia ya fuiste a Gr. ${gv.map(esc).join(', ')} (este grupo son otros estudiantes)`:' · ya fuiste por otra materia: aquí se repiten estudiantes';
 if(p>=.85)t+=' · <b>año casi completo, mejor otro curso</b>';
 return `<p class="s">${t}</p>`;
}
const cubOtra=r=>!V[r.id]&&covG.has(r.gk);
const cubTxt=r=>{const c=covBy.get(r.gk),o=c&&R[c.id];return o?`ya visitada el ${DN[o.dow]} ${hm(o.ini)} (aula ${esc(o.aula)}${c.por?' · '+esc(c.por):''})`:'grupo ya visitado'};
function gain(r){ // estudiantes nuevos que aporta visitar esta clase
 if(covG.has(r.gk))return 0;const S=COH.get(r.coh)||r.n,cm=covM.get(r.mk)||0,fm=Math.min(1,cm/S);
 const prodAll=U.coh.get(r.coh)??1,other=fm<1?prodAll/(1-fm):0;
 return S*other*(Math.min(1,(cm+r.n)/S)-fm);
}

function vMapa(){

function covCar(VV){ // misma lógica que derive(), para un subconjunto de visitas
 const gN=new Map();
 for(const[id,v]of Object.entries(VV)){if(v.e!=='ok')continue;const r=R[id];if(!r)continue;const n=Math.min(v.n??r.n,COH.get(r.coh)||r.n);gN.set(r.gk,Math.max(gN.get(r.gk)||0,n))}
 const cm=new Map();gN.forEach((n,gk)=>{const mk=gk.slice(0,gk.lastIndexOf('|'));cm.set(mk,(cm.get(mk)||0)+n)});
 const coh=new Map();cm.forEach((c,mk)=>{const p=mk.split('|'),k=p[0]+'|'+p[1],S=COH.get(k)||1;coh.set(k,(coh.get(k)||1)*(1-Math.min(1,c/S)))});
 const car={};coh.forEach((pr,k)=>{const ci=+k.split('|')[0];car[ci]=(car[ci]||0)+(COH.get(k)||0)*(1-pr)});
 for(const ci in car)car[ci]=Math.min(car[ci],DATA.CM[ci]||Infinity);
 return car;
}
function porFac(car){const o={};DATA.FAC.forEach((n,i)=>o[i]={c:0,t:0});for(const ci in CAR_FI){const f=CAR_FI[ci];o[f].t+=DATA.CM[ci]||0;o[f].c+=car[ci]||0}return o}

 const pc=(o)=>o.t?o.c/o.t*100:0;
